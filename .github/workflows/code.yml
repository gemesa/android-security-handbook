name: Code

on: [push]

jobs:
  check-format-and-build:
    runs-on: ubuntu-latest
    env:
      TARGET: aarch64-linux-android
      API: 36
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Install Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30
          local-cache: true

      - name: Configure NDK linker
        run: |
          BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/${TARGET}${API}-clang" >> "$GITHUB_ENV"

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --target $TARGET -- -D warnings

      - name: cargo build
        run: cargo build --release --target $TARGET
