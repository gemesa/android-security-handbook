name: Code

on: [push]

jobs:
  check-format-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
          components: rustfmt, clippy

      - name: Install Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30
          local-cache: false

      - name: Configure NDK linkers
        run: |
          BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android36-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$BIN/x86_64-linux-android36-clang" >> "$GITHUB_ENV"

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: |
          cargo clippy --target aarch64-linux-android -- -D warnings
          cargo clippy --target x86_64-linux-android -- -D warnings

      - name: cargo build
        run: |
          cargo build --release --target aarch64-linux-android
          cargo build --release --target x86_64-linux-android
